<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Allow access — Portfolio Builder</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body>
    <h1>Allow access to <span id="site"></span>?</h1>
    <p>
      Portfolio Builder asks to open this site once to <span id="purpose"></span>. Nothing is sent
      anywhere except to your Portfolio Builder tab. You can remove access any time in the
      extension's settings.
    </p>
    <div class="row">
      <button id="allow" type="button">Allow</button>
      <button id="deny" type="button" class="secondary">Not now</button>
    </div>
    <script src="permission.js"></script>
  </body>
</html>
